<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3efe7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081417" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sip">
<meta name="description" content="Gentle nudges to drink water and take a break.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
<title>Sip</title>
</head>
<body>

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.2c-3.2 4-6 7.1-6 10.6a6 6 0 0 0 12 0c0-3.5-2.8-6.600-6-10.600z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9.300 14.300a2.800 2.800 0 0 0 2.300 2.600" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-drop-fill" viewBox="0 0 24 24"><path d="M12 2.600c-3.400 4.200-6.600 7.600-6.600 11.300a6.600 6.600 0 0 0 13.200 0c0-3.700-3.200-7.100-6.600-11.300z" fill="currentColor"/></symbol>
    <symbol id="i-roll" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="8" cy="9.500" rx="4.500" ry="6"/><ellipse cx="8" cy="9.500" rx="1.200" ry="1.800"/><path d="M8 3.500h8.500c2.500 0 4.500 2.700 4.500 6v9.500a1.500 1.500 0 0 1-1.500 1.500H14a1.500 1.500 0 0 1-1.500-1.500v-9.500"/></g></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.500 7.500h2.600l1.500-2.300h6.800l1.500 2.300h2.600A1.500 1.500 0 0 1 21 9v9a1.500 1.500 0 0 1-1.500 1.500h-15A1.500 1.500 0 0 1 3 18V9a1.500 1.500 0 0 1 1.500-1.500z"/><circle cx="12" cy="13.200" r="3.400"/></g></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.500l4.500 4.500L19 7.500" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6.500 6.500l11 11M17.500 6.500l-11 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9.500 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M14.500 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.200A8 8 0 0 1 9.800 4a8 8 0 1 0 10.200 10.200z" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linejoin="round"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10a6 6 0 0 1 12 0c0 4.500 1.500 6 2 6.500H4c.5-.5 2-2 2-6.500z"/><path d="M10 19.500a2.100 2.100 0 0 0 4 0"/></g></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c.6 3-1.400 4.300-2.800 6.200C8 10.800 7 12.400 7 14.500a5 5 0 0 0 10 0c0-1.600-.6-2.800-1.300-3.800-.5 1-1.200 1.500-2 1.700.6-3-.2-6.800-1.700-9.400z" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linejoin="round"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><path d="M12 14.500V3.500M8 7l4-3.800L16 7"/><path d="M8.500 10.500H7A1.500 1.500 0 0 0 5.500 12v7A1.500 1.500 0 0 0 7 20.500h10a1.500 1.500 0 0 0 1.500-1.500v-7a1.500 1.500 0 0 0-1.500-1.500h-1.500"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5.500v13M5.500 12h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5.500 12h13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-plus-box" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.500v7M8.500 12h7"/></g></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 19.500S4.500 15 4.500 9.600A3.900 3.900 0 0 1 12 8a3.900 3.900 0 0 1 7.500 1.600c0 5.400-7.500 9.900-7.500 9.900z" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linejoin="round"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round"><rect x="6.500" y="2.500" width="11" height="19" rx="2.600"/><path d="M10.500 18.500h3"/></g></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></g></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.800v5M12 16.200v.1"/></g></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="5.500" r="1.700"/><circle cx="12" cy="12" r="1.700"/><circle cx="12" cy="18.500" r="1.700"/></g></symbol>
    <symbol id="i-logo" viewBox="0 0 64 64"><path d="M32 6C22 19 13 28.500 13 39.500a19 19 0 0 0 38 0C51 28.500 42 19 32 6z" fill="var(--logo-drop, #f6fbfa)"/><path d="M13.300 42.500c3.500-2.600 7-2.600 10.500 0s7 2.600 10.500 0 7-2.600 10.500 0c2 1.500 4 2.100 5.900 1.900A19 19 0 0 1 13.300 42.500z" fill="var(--logo-water, #49bfc8)"/></symbol>
  </defs>
</svg>

<!-- Passcode gate -->
<section id="gate" class="screen stage" hidden>
  <div class="stage-body">
    <div class="mark"><svg viewBox="0 0 64 64"><use href="#i-logo"/></svg></div>
    <h1 class="display">Sip</h1>
    <p class="lede">Pop in the passcode to open things up.</p>
    <form id="gate-form" class="gate-form" novalidate>
      <input id="gate-key" class="field big" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Passcode" aria-label="Passcode" aria-describedby="gate-msg">
      <p id="gate-msg" class="field-msg" role="alert"></p>
      <button class="btn primary block" id="gate-go">Open Sip</button>
    </form>
  </div>
</section>

<!-- Onboarding -->
<section id="onboard" class="screen stage" hidden>
  <div class="ob-top">
    <button class="iconbtn quiet" id="ob-back" aria-label="Back" hidden><svg><use href="#i-back"/></svg></button>
    <div class="ob-dots" id="ob-dots" aria-hidden="true"></div>
    <button class="textbtn" id="ob-skip">Skip</button>
  </div>
  <div class="stage-body" id="ob-body"></div>
  <div class="stage-foot" id="ob-foot"></div>
</section>

<!-- Home -->
<main id="home" class="screen" hidden>
  <header class="topbar">
    <div class="hello">
      <p class="eyebrow" id="hello-eyebrow">&nbsp;</p>
      <h1 class="display" id="hello-name">&nbsp;</h1>
    </div>
    <button class="iconbtn" id="open-settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="hero" id="hero" data-state="loading" aria-live="polite">
    <div class="water" aria-hidden="true">
      <svg class="wave back" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20Q150 0 300 20T600 20T900 20T1200 20V40H0Z"/></svg>
      <svg class="wave front" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20Q150 38 300 20T600 20T900 20T1200 20V40H0Z"/></svg>
      <div class="water-body"></div>
    </div>
    <div class="hero-content">
      <p class="kicker"><span class="pip"></span><span id="hero-kicker"></span></p>
      <div class="hero-main">
        <p class="hero-big" id="hero-big"></p>
        <p class="hero-sub" id="hero-sub"></p>
      </div>
      <div class="hero-actions" id="hero-actions"></div>
    </div>
  </section>

  <section class="tiles" id="tiles" aria-label="Log now"></section>
  <section class="card" id="today" aria-label="Today"></section>
  <section class="card" id="gallery" aria-label="Latest photos" hidden></section>
  <section class="card" id="week" aria-label="Last 7 days"></section>
  <section class="card" id="log" aria-label="Recent"></section>
  <p class="foot-note" id="foot-note"></p>
</main>

<!-- Capture -->
<section id="capture" class="capture" hidden aria-label="Log it">
  <div class="cap-stage">
    <video id="cap-video" playsinline muted autoplay></video>
    <div class="cap-flash" id="cap-flash"></div>
    <div class="cap-backdrop" aria-hidden="true">
      <div class="water">
        <svg class="wave back" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20Q150 0 300 20T600 20T900 20T1200 20V40H0Z"/></svg>
        <svg class="wave front" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20Q150 38 300 20T600 20T900 20T1200 20V40H0Z"/></svg>
        <div class="water-body"></div>
      </div>
    </div>
    <div class="cap-top">
      <button class="iconbtn glass" id="cap-close" aria-label="Close"><svg><use href="#i-x"/></svg></button>
      <div class="cap-chip"><svg id="cap-icon"><use href="#i-drop"/></svg><span id="cap-title"></span></div>
      <span class="cap-spacer"></span>
    </div>
    <div class="cap-panel" id="cap-panel">
      <div class="cap-badge"><svg id="cap-panel-icon"><use href="#i-roll"/></svg></div>
      <h2 class="display" id="cap-panel-title"></h2>
      <p id="cap-panel-sub"></p>
    </div>
    <div class="cap-bottom">
      <p class="cap-hint" id="cap-hint"></p>
      <div class="cap-controls" id="cap-controls">
        <button class="textbtn light" id="cap-skip">Skip photo</button>
        <button class="shutter" id="cap-shutter" aria-label="Take photo and log it"><span></span></button>
        <span class="cap-spacer"></span>
      </div>
      <div class="cap-stack" id="cap-stack">
        <button class="btn light block xl" id="cap-done"><svg><use href="#i-check"/></svg><span>Done</span></button>
        <label class="btn light block xl" id="cap-file-label" for="cap-file"><svg><use href="#i-camera"/></svg><span>Open camera</span></label>
        <button class="textbtn light" id="cap-alt"></button>
      </div>
    </div>
  </div>
  <input id="cap-file" type="file" accept="image/*" capture="user" class="sr-only" tabindex="-1">
</section>

<!-- Success moment -->
<div id="success" class="success" hidden role="status" aria-live="assertive">
  <div class="water">
    <svg class="wave back" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20Q150 0 300 20T600 20T900 20T1200 20V40H0Z"/></svg>
    <svg class="wave front" viewBox="0 0 1200 40" preserveAspectRatio="none"><path d="M0 20Q150 38 300 20T600 20T900 20T1200 20V40H0Z"/></svg>
    <div class="water-body"></div>
  </div>
  <div class="success-inner">
    <div class="success-ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="29"/><path d="M19 33.500l9 9L46 23.500"/></svg></div>
    <p class="display" id="success-title"></p>
    <p id="success-sub"></p>
  </div>
</div>

<!-- Settings sheet -->
<div id="sheet-backdrop" class="backdrop" hidden></div>
<section id="settings" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <header class="sheet-head">
    <span class="grabber" aria-hidden="true"></span>
    <h2 id="settings-title">Settings</h2>
    <span class="save-state" id="save-state" role="status"></span>
    <button class="iconbtn soft" id="settings-close" aria-label="Close settings"><svg><use href="#i-x"/></svg></button>
  </header>
  <div class="sheet-body" id="settings-body"></div>
</section>

<!-- Photo viewer -->
<dialog id="viewer" class="viewer">
  <button class="iconbtn glass" id="viewer-close" aria-label="Close photo"><svg><use href="#i-x"/></svg></button>
  <figure>
    <div class="viewer-frame"><img id="viewer-img" alt="Photo proof"><div class="spinner" id="viewer-spin"></div></div>
    <figcaption id="viewer-cap"></figcaption>
  </figure>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Shown only if the app's scripts fail to load (flaky connection) -->
<section id="boot-fail" class="screen stage" hidden>
  <div class="stage-body">
    <div class="mark"><svg viewBox="0 0 64 64"><use href="#i-logo"/></svg></div>
    <h1 class="display" style="font-size:44px">That didn't load</h1>
    <p class="lede">Looks like a shaky connection. Give it another go.</p>
    <div class="gate-form"><button class="btn primary block" type="button" onclick="location.reload()">Try again</button></div>
  </div>
</section>

<script src="config.js"></script>
<script type="module" src="js/app.js" onerror="document.getElementById('boot-fail').hidden=false"></script>
</body>
</html>
